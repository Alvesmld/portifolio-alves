<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Tarefas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo">
                <i class="fas fa-tasks"></i>
                <span>TaskMaster</span>
            </div>
            <div class="user-info">
                <i class="fas fa-user-circle"></i>
                <span>Alves</span>
            </div>
        </header>

        <main class="main">
            <div class="add-task-section">
                <input type="text" id="taskInput" placeholder="Adicionar nova tarefa..." class="task-input">
                <select id="categorySelect" class="category-select">
                    <option value="trabalho">Trabalho</option>
                    <option value="pessoal">Pessoal</option>
                    <option value="estudos">Estudos</option>
                    <option value="outros">Outros</option>
                </select>
                <button class="btn-add" onclick="addTask()">
                    <i class="fas fa-plus"></i>
                </button>
            </div>

            <div class="filter-section">
                <button class="filter-btn active" onclick="filterTasks('all')">Todas</button>
                <button class="filter-btn" onclick="filterTasks('pending')">Pendentes</button>
                <button class="filter-btn" onclick="filterTasks('completed')">Concluídas</button>
            </div>

            <div class="tasks-container" id="tasksContainer">
                <!-- Tasks will be loaded here -->
            </div>

            <div class="stats-section">
                <div class="stat-card">
                    <i class="fas fa-list"></i>
                    <span id="totalTasks">0</span>
                    <p>Total</p>
                </div>
                <div class="stat-card">
                    <i class="fas fa-clock"></i>
                    <span id="pendingTasks">0</span>
                    <p>Pendentes</p>
                </div>
                <div class="stat-card">
                    <i class="fas fa-check-circle"></i>
                    <span id="completedTasks">0</span>
                    <p>Concluídas</p>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
